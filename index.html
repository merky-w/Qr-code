<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensured viewport allows zooming for the PDF iframe -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9th Vojvodina Open ITF - Tournament Brackets</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a3a6c 0%, #0d2a52 100%);
        min-height: 100vh;
        color: #333;
        overflow-x: hidden;
        padding-bottom: 40px; /* Space for scrolling */
      }

      .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 10px;
      }

      header {
        text-align: center;
        padding: 25px 15px;
        color: white;
      }

      header h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        line-height: 1.3;
      }

      header p {
        font-size: 1rem;
        opacity: 0.9;
      }

      /* Main Menu Styles */
      .main-menu {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 30px;
        padding: 0 10px;
      }

      .menu-btn {
        padding: 20px 30px;
        font-size: 1.3rem;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .patterns-btn {
        background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
        color: #1a3a6c;
      }

      .sparring-btn {
        background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
        color: white;
      }

      .menu-btn:active {
        transform: scale(0.98);
      }

      /* Viewer Container Styles */
      .bracket-viewer {
        display: none; /* Hidden by default */
        background: white;
        border-radius: 12px;
        padding: 12px;
        margin-top: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        min-height: 80vh; /* Ensure it takes up screen space */
        flex-direction: column;
      }

      .bracket-viewer.active {
        display: flex;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .viewer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 3px solid #d4af37;
        flex-wrap: wrap;
        gap: 10px;
      }

      .viewer-title {
        font-size: 1.3rem;
        color: #1a3a6c;
        font-weight: bold;
        flex: 1;
        min-width: 200px;
      }

      .back-btn {
        padding: 10px 20px;
        background: #1a3a6c;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }

      .back-btn:active {
        background: #0d2a52;
      }

      /* PDF Container */
      .bracket-image {
        width: 100%;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background: #f0f0f0;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #ddd;
      }

      .bracket-image iframe {
        width: 100%;
        height: 80vh;
        border: none;
        display: block;
      }

      .hint {
        text-align: center;
        padding: 12px;
        background: #e7f3ff;
        border-radius: 8px;
        margin-top: 15px;
        color: #1a3a6c;
        font-size: 0.9rem;
        line-height: 1.4;
        border: 1px solid #b8daff;
      }

      /* Desktop Adjustments */
      @media (min-width: 769px) {
        .main-menu {
          flex-direction: row;
          justify-content: center;
        }
        .menu-btn {
          padding: 25px 50px;
          font-size: 1.4rem;
        }
        .bracket-image iframe {
          height: 85vh;
        }
      }

      @media (max-width: 400px) {
        header h1 {
          font-size: 1.5rem;
        }
        .menu-btn {
          font-size: 1.1rem;
          padding: 18px 25px;
        }
        .viewer-title {
          font-size: 1.1rem;
        }
        .bracket-image iframe {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🥋 9th Vojvodina Open ITF</h1>
        <p>Tournament Brackets & Draws</p>
      </header>

      <!-- Main Menu -->
      <div id="mainMenu" class="main-menu">
        <button
          class="menu-btn patterns-btn"
          onclick="showBrackets('patterns')"
        >
          📋 Patterns (Tul)
        </button>
        <button
          class="menu-btn sparring-btn"
          onclick="showBrackets('sparring')"
        >
          🥊 Sparring (Matsogi)
        </button>
      </div>

      <!-- 🥊 Sparring Viewer -->
      <div id="sparringViewer" class="bracket-viewer">
        <div class="viewer-header">
          <h2 class="viewer-title">🥊 Sparring Brackets</h2>
          <button class="back-btn" onclick="goBack()">← Menu</button>
        </div>

        <div class="bracket-image">
          <iframe
            src="https://cziwnycosdxeuacslcza.supabase.co/storage/v1/object/public/teakwondo%20sparring/Tournament%20Manager%20-%209-th%20Vojvodina%20Open%20ITF.pdf#toolbar=0&navpanes=0"
            width="100%"
            height="80vh"
            style="border: none"
          >
          </iframe>
        </div>

        <div class="hint">
          📱 <strong>Mobile Tip:</strong> Pinch to zoom and scroll to see all
          brackets.
        </div>
      </div>

      <!-- 📋 Patterns Viewer -->
      <div id="patternsViewer" class="bracket-viewer">
        <div class="viewer-header">
          <h2 class="viewer-title">📋 Patterns Brackets</h2>
          <button class="back-btn" onclick="goBack()">← Menu</button>
        </div>

        <div class="bracket-image">
          <iframe
            src="https://cziwnycosdxeuacslcza.supabase.co/storage/v1/object/public/teakwondo%20patterns/Tournament%20Manager%20-%209-th%20Vojvodina%20Open%20ITF.pdf#toolbar=0&navpanes=0"
            width="100%"
            height="80vh"
            style="border: none"
          >
          </iframe>
        </div>

        <div class="hint">
          📱 <strong>Mobile Tip:</strong> Pinch to zoom and scroll to see all
          brackets.
        </div>
      </div>
    </div>

    <script>
      // Simple Navigation Logic
      function showBrackets(type) {
        // Hide Menu
        document.getElementById("mainMenu").style.display = "none";

        // Hide all viewers
        document.getElementById("patternsViewer").classList.remove("active");
        document.getElementById("sparringViewer").classList.remove("active");

        // Show selected viewer
        if (type === "patterns") {
          document.getElementById("patternsViewer").classList.add("active");
        } else if (type === "sparring") {
          document.getElementById("sparringViewer").classList.add("active");
        }

        // Scroll to top
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function goBack() {
        // Hide viewers
        document.getElementById("patternsViewer").classList.remove("active");
        document.getElementById("sparringViewer").classList.remove("active");

        // Show Menu
        document.getElementById("mainMenu").style.display = "flex";

        // Scroll to top
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
