<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9th Vojvodina Open ITF - Tournament Brackets</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a3a6c 0%, #0d2a52 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      color: white;
    }

    header h1 {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.9;
    }

    .main-menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 40px;
      align-items: center;
    }

    .menu-btn {
      padding: 22px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      color: white;
      transition: 0.2s;
    }

    .patterns-btn {
      background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
      color: #1a3a6c;
    }

    .sparring-btn {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
    }

    .menu-btn:hover {
      opacity: 0.9;
    }

    .bracket-viewer {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .bracket-viewer.active {
      display: block;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 3px solid #d4af37;
      padding-bottom: 10px;
    }

    .viewer-title {
      font-size: 1.3rem;
      color: #1a3a6c;
      font-weight: bold;
    }

    .back-btn {
      padding: 8px 18px;
      background: #1a3a6c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .pdf-container {
      width: 100%;
      height: 90vh;
    }

    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hint {
      margin-top: 15px;
      text-align: center;
      background: #e7f3ff;
      padding: 10px;
      border-radius: 8px;
      color: #1a3a6c;
      font-size: 0.9rem;
    }

    @media (min-width: 768px) {
      .main-menu {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>🥋 9th Vojvodina Open ITF</h1>
      <p>Tournament Brackets & Draws</p>
    </header>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="main-menu">
      <button class="menu-btn patterns-btn" onclick="showBrackets('patterns')">
        📋 Patterns (Tul)
      </button>

      <button class="menu-btn sparring-btn" onclick="showBrackets('sparring')">
        🥊 Sparring (Matsogi)
      </button>
    </div>

    <!-- PATTERNS VIEWER -->
    <div id="patternsViewer" class="bracket-viewer">
      <div class="viewer-header">
        <div class="viewer-title">📋 Patterns Brackets</div>
        <button class="back-btn" onclick="goBack()">← Menu</button>
      </div>

      <div class="pdf-container">
        <iframe 
          src="https://cziwnycosdxeuacslcza.supabase.co/storage/v1/object/public/teakwondo%20patterns/Tournament%20Manager%20-%209-th%20Vojvodina%20Open%20ITF.pdf#toolbar=0">
        </iframe>
      </div>

      <div class="hint">
        📱 Pinch to zoom • Scroll to navigate brackets
      </div>
    </div>

    <!-- SPARRING VIEWER -->
    <div id="sparringViewer" class="bracket-viewer">
      <div class="viewer-header">
        <div class="viewer-title">🥊 Sparring Brackets</div>
        <button class="back-btn" onclick="goBack()">← Menu</button>
      </div>

      <div class="pdf-container">
        <iframe 
          src="https://cziwnycosdxeuacslcza.supabase.co/storage/v1/object/public/teakwondo%20sparring/Tournament%20Manager%20-%209-th%20Vojvodina%20Open%20ITF.pdf#toolbar=0">
        </iframe>
      </div>

      <div class="hint">
        📱 Pinch to zoom • Scroll to navigate brackets
      </div>
    </div>

  </div>

  <script>
    function showBrackets(type) {
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("patternsViewer").classList.remove("active");
      document.getElementById("sparringViewer").classList.remove("active");

      if (type === "patterns") {
        document.getElementById("patternsViewer").classList.add("active");
      } else {
        document.getElementById("sparringViewer").classList.add("active");
      }

      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById("patternsViewer").classList.remove("active");
      document.getElementById("sparringViewer").classList.remove("active");
      document.getElementById("mainMenu").style.display = "flex";
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
